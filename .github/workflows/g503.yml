name: G503

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GOCACHE: /tmp/g503-ci-go-cache
      G503_HOME: /tmp/g503-local-e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check shell scripts
        run: for script in dev/scripts/*.sh dev/scripts/tests/*.sh; do bash -n "$script" || exit; done
      - name: SSH helper regression tests
        run: bash dev/scripts/test-ssh-helpers.sh
      - name: Five-host plan without SSH or credentials
        run: go run ./dev/agent/cmd/g503-multihost -inventory dev/multihost.example.json -revision "$GITHUB_SHA"
      - name: Go test
        run: go test ./...
      - name: Go vet
        run: go vet ./...
      - name: Go race test
        run: go test -race -count=1 ./...
      - name: Single-node E2E
        run: ./dev/scripts/run-local-e2e-demo.sh

  five-validator-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOCACHE: /tmp/g503-ci-go-cache
      G503_MULTI_HOME: /tmp/g503-five-validator-e2e
      G503_LIFECYCLE_HOME: /tmp/g503-validator-lifecycle-e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Five-validator E2E
        run: ./dev/scripts/run-five-validator-e2e.sh
      - name: Five agents, controller SIGKILL recovery, guarded operator CLI and RPC failover
        env:
          G503_MULTI_HOME: /tmp/g503-five-agent-e2e
        run: bash dev/scripts/run-agent-recovery-e2e.sh
      - name: Five-validator lifecycle E2E
        run: bash dev/scripts/run-validator-lifecycle-e2e.sh
      - name: Compound RPC outage, validator churn and old-owner fencing
        env:
          G503_LIFECYCLE_HOME: /tmp/g503-ownership-snapshot-e2e
        run: bash dev/scripts/run-ownership-snapshot-e2e.sh
      - name: Preserve E2E logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: five-validator-e2e-logs
          path: |
            /tmp/g503-five-validator-e2e/logs
            /tmp/g503-five-agent-e2e/logs
            /tmp/g503-validator-lifecycle-e2e/logs
            /tmp/g503-ownership-snapshot-e2e/logs
          retention-days: 7
